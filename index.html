<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Design.today - Discover top designers and creative inspirations."
    />
    <meta
      name="keywords"
      content="design, portfolio, UI, UX, web design, creative"
    />
    <meta property="og:title" content="Design.today - Creative Portfolio" />
    <meta
      property="og:description"
      content="Explore the best design works and creative projects."
    />
    <meta property="og:image" content="images/Rectangle1.png" />
    <meta property="og:url" content="https://www.design.today" />
    <meta property="og:type" content="website" />
    <title>Midterm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="images/design.today.svg" alt="Design Today Logo" />
        <img src="images/menu_icon.svg" alt="Menu" class="menu-icon" />
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active">
          <img src="images/home_icon.svg" alt="Home" />
          <span>Home</span>
        </a>
        <a href="#" class="nav-item">
          <img src="images/explore_icon.svg" alt="Explore" />
          <span>Explore</span>
        </a>
        <a href="#" class="nav-item">
          <img src="images/folder_icon.svg" alt="Folders" />
          <span>Folders</span>
        </a>
        <a href="#" class="nav-item">
          <img src="images/favourites_icon.svg" alt="Favourites" />
          <span>Favourites</span>
        </a>
        <a href="#" class="nav-item">
          <img src="images/activities_icon.svg" alt="Activities" />
          <span>Activities</span>
        </a>
      </nav>
      <div class="sidebar-following">
        <h4>FOLLOWING</h4>
        <div class="following-list">
          <div class="following-item">
            <img src="images/following1.png" alt="Sajon" />
            <span>Sajon</span>
          </div>
          <div class="following-item">
            <img src="images/following2.png" alt="Tran Mau Tri Tam" />
            <span>Tran Mau Tri Tam</span>
          </div>
          <div class="following-item">
            <img src="images/following3.png" alt="Ghani Pradita" />
            <span>Ghani Pradita</span>
          </div>
          <div class="following-item">
            <img src="images/following4.png" alt="David Kovalev" />
            <span>David Kovalev</span>
          </div>
          <div class="following-item">
            <img src="images/following5.png" alt="Ryan Putnam" />
            <span>Ryan Putnam</span>
          </div>
        </div>
        <button class="load-more-btn">Load more (15)</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="search-bar">
          <input type="text" placeholder="Search inspiration" />
          <img src="images/search_icon.svg" alt="Search" />
        </div>
        <div class="header-actions">
          <span class="go-pro">GO PRO!</span>
          <div class="icon-badge-wrapper">
          <img src="images/mail_icon.svg" alt="Mail" />
          <img src="images/notification_icon.svg" alt="Notifications" />
          <a href="profile.html" class="profile-link">
            <img
              src="images/profile_photo.png"
              alt="Profile"
              class="profile-photo"
            />
          </a>
          <button class="upload-btn">UPLOAD</button>
        </div>
      </header>
    </main>
  </body>
</html>
